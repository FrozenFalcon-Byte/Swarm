# Runs the Swarm worker on GitHub's free runners every 15 minutes: no server of your own.
# Each run picks up queued runs and actions, checks connected repos for new issues, then exits.
# Runners have Docker, so every test runs in the locked-down sandbox container.
#
# Repository → Settings → Secrets and variables → Actions → New repository secret:
#   FIREBASE_SERVICE_ACCOUNT_JSON   the whole service-account JSON file
#   GROQ_API_KEY, GEMINI_API_KEY    at least one model key (optional: heuristics without)
#   GH_WORKER_TOKEN                 optional fallback GitHub token for repos whose owner hasn't connected GitHub
name: swarm worker

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by a few minutes when busy
  workflow_dispatch: {}       # "Run workflow" button for an immediate pass

concurrency:
  group: swarm-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[cloud]"
      - name: One worker pass
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_WORKER_TOKEN }}
          SWARM_SANDBOX: docker
          SWARM_HOME: ${{ runner.temp }}/swarm
        run: swarm -v worker --once
